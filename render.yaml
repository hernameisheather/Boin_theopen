services:
  - type: web
    name: student-portal
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: APP_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.0"
    disk:
      name: data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
