{% extends "base.html" %}
{% block title %}기록 수정{% endblock %}
{% block content %}
{% include "_admin_nav.html" %}

<header class="page-header">
  <h1>✏️ 기록 수정</h1>
  <a href="{{ url_for('admin_records') }}" class="btn-ghost">← 목록으로</a>
</header>

<section class="card">
  <form method="post" class="form">
    <div class="form-row">
      <label>
        <span>날짜</span>
        <input type="date" name="date" value="{{ record.date }}" required>
      </label>
      <label>
        <span>학생</span>
        <select name="student_code" required>
          {% for code, s in students.items() %}
          <option value="{{ code }}" {% if record.student_code == code %}selected{% endif %}>{{ s.name }} ({{ code }})</option>
          {% endfor %}
        </select>
      </label>
      <label>
        <span>항목</span>
        <input type="text" name="category" value="{{ record.category }}" list="category-list" required>
        <datalist id="category-list">
          {% for c in categories %}<option value="{{ c }}">{% endfor %}
        </datalist>
      </label>
      <label>
        <span>점수/결과</span>
        <input type="text" name="score" value="{{ record.score }}" required>
      </label>
      <label>
        <span>비고 (재시/숙제미비 등)</span>
        <select name="flag">
          <option value="" {% if not record.flag %}selected{% endif %}>— 없음 —</option>
          <option value="재시" {% if record.flag == '재시' %}selected{% endif %}>⚠️ 재시</option>
          <option value="숙제미비" {% if record.flag == '숙제미비' %}selected{% endif %}>📕 숙제미비</option>
          <option value="추가과제" {% if record.flag == '추가과제' %}selected{% endif %}>📝 추가과제</option>
          <option value="결석" {% if record.flag == '결석' %}selected{% endif %}>🚫 결석</option>
          <option value="우수" {% if record.flag == '우수' %}selected{% endif %}>🌟 우수</option>
          {% if record.flag and record.flag not in ['재시', '숙제미비', '추가과제', '결석', '우수'] %}
          <option value="{{ record.flag }}" selected>📌 {{ record.flag }} (사용자 정의)</option>
          {% endif %}
        </select>
      </label>
      <label>
        <span>학기/과정</span>
        <select name="term">
          {% set current_term = record.term or default_term %}
          {% for t in terms %}
          <option value="{{ t }}" {% if t == current_term %}selected{% endif %}>{{ t }}</option>
          {% endfor %}
        </select>
      </label>
    </div>
    <label class="checkbox-label">
      <input type="checkbox" name="resolved" {% if record.resolved %}checked{% endif %}>
      <span>✅ 처리 완료 (재시 마침 / 숙제 제출 등) — 체크하면 학부모 페이지 알림에서 사라집니다</span>
    </label>
    <label>
      <span>피드백</span>
      <textarea name="feedback" rows="4">{{ record.feedback }}</textarea>
    </label>
    <div class="form-actions">
      <button type="submit" class="btn-primary">수정 저장</button>
      <a href="{{ url_for('admin_records') }}" class="btn-ghost">취소</a>
    </div>
  </form>
</section>

{% set student_name = students.get(record.student_code, {}).get('name', '?') %}
<section class="card danger-zone">
  <h2>⚠️ 위험 작업</h2>
  <p class="muted">이 기록을 영구적으로 삭제합니다. 되돌릴 수 없습니다.</p>
  <form method="post" onsubmit="return confirm('정말 이 기록을 삭제하시겠습니까?\n\n날짜: {{ record.date }}\n학생: {{ student_name }}\n항목: {{ record.category }}\n점수: {{ record.score }}\n\n되돌릴 수 없습니다.');">
    <input type="hidden" name="action" value="delete">
    <button type="submit" class="btn-danger">이 기록 삭제</button>
  </form>
</section>
{% endblock %}
